name: Notebook release execution

on:
  pull_request:
    paths:
      - "tutorials/**"
      - "mitra_pipeline/**"
      - "examples/sample-data/**"
      - "examples/build_sample_datasets.py"
      - "scripts/validate_colab_tutorial.py"
      - "scripts/test_tutorial_api.py"
      - ".github/workflows/notebook-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  execute-notebooks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DIMER_REPO_REF: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"

      - name: Prepare notebook runtime
        run: |
          sudo mkdir -p /content
          sudo chown -R "$USER":"$USER" /content
          python -m pip install --upgrade pip==26.2.1
          python -m pip install psutil==7.1.3 nbconvert==7.17.1 ipykernel==7.3.0

      - name: Execute E2E default path from clean state
        id: e2e
        run: |
          # Execute a copy from /content so the kernel's working directory matches Colab's.
          cp tutorials/mitra_regressor_colab.ipynb /content/mitra_regressor_colab.ipynb
          jupyter nbconvert \
            --to notebook \
            --execute /content/mitra_regressor_colab.ipynb \
            --output executed-mitra-regressor-e2e.ipynb \
            --output-dir /content \
            --ExecutePreprocessor.timeout=2400 \
            --ExecutePreprocessor.kernel_name=python3

      - name: Prepare independent inference input and trusted archive digest
        id: prepare-inference
        run: |
          mkdir -p /content/mitra-tutorial /content/mitra-inference
          cp /content/outputs/mitra_regressor_predictor.zip /content/mitra-tutorial/mitra-predictor.zip
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          from sklearn.datasets import load_diabetes

          # Unlabelled rows with the default E2E sample's feature schema (the notebook's inference
          # cell requires exactly the bundle's feature columns; the target is withheld).
          load_diabetes(as_frame=True).data.tail(24).to_csv("/content/inference.csv", index=False)

          zip_path = Path("/content/mitra-tutorial/mitra-predictor.zip")
          digest = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          # The standalone notebook takes these through its form fields; set them in an executed copy only.
          fields = {
              "ARTIFACT_ZIP_PATH = ''": f"ARTIFACT_ZIP_PATH = '{zip_path}'",
              "EXPECTED_ZIP_SHA256 = ''": f"EXPECTED_ZIP_SHA256 = '{digest}'",
              "NEW_DATA_PATH = ''": "NEW_DATA_PATH = '/content/inference.csv'",
          }
          source = Path("tutorials/mitra_regressor_predictor_inference_colab.ipynb")
          notebook = json.loads(source.read_text(encoding="utf-8"))
          for cell in notebook["cells"]:
              if cell.get("cell_type") != "code":
                  continue
              text = "".join(cell["source"]) if isinstance(cell["source"], list) else cell["source"]
              for marker, value in fields.items():
                  if marker in text:
                      text = text.replace(marker, value, 1)
                      fields[marker] = None
              cell["source"] = text.splitlines(keepends=True)
          missing = [marker for marker, value in fields.items() if value is not None]
          if missing:
              raise RuntimeError(f"Inference notebook form fields not found: {missing}")
          Path("/content/mitra_regressor_predictor_inference_colab.ipynb").write_text(json.dumps(notebook, indent=1), encoding="utf-8")
          print(f"Trusted predictor archive SHA-256: {digest}")
          PY

      - name: Execute artifact-inference notebook against external producer artifact
        id: artifact-inference
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute /content/mitra_regressor_predictor_inference_colab.ipynb \
            --output executed-mitra-regressor-artifact-inference.ipynb \
            --output-dir /content \
            --ExecutePreprocessor.timeout=1200 \
            --ExecutePreprocessor.kernel_name=python3
          cp /content/outputs/mitra_regressor_predictor_inference_predictions.csv /content/mitra-inference/predictions.csv

      - name: Upload executed notebooks and predictor artifact
        id: upload-evidence
        if: ${{ always() && steps.e2e.outcome == 'success' && steps.prepare-inference.outcome == 'success' && steps.artifact-inference.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mitra-regressor-notebook-release-evidence
          path: |
            /content/executed-mitra-regressor-e2e.ipynb
            /content/executed-mitra-regressor-artifact-inference.ipynb
            /content/mitra-tutorial/mitra-predictor.zip
            /content/mitra-inference/predictions.csv
          if-no-files-found: error
          retention-days: 30

      - name: Record release evidence
        if: always()
        env:
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
          PREPARE_OUTCOME: ${{ steps.prepare-inference.outcome }}
          INFERENCE_OUTCOME: ${{ steps.artifact-inference.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload-evidence.outcome }}
        run: |
          if [[ "$E2E_OUTCOME" == "success" && "$PREPARE_OUTCOME" == "success" && "$INFERENCE_OUTCOME" == "success" && "$UPLOAD_OUTCOME" == "success" ]]; then
            RELEASE_STATUS="PASS"
          else
            RELEASE_STATUS="INCOMPLETE/FAIL"
          fi
          {
            echo "## Mitra Regressor notebook release execution"
            echo
            echo "- Candidate SHA: \`${DIMER_REPO_REF}\`"
            echo "- Runner: \`${RUNNER_OS}\`"
            echo "- Python: \`$(python --version 2>&1)\`"
            echo "- E2E clean execution outcome: \`${E2E_OUTCOME}\`"
            echo "- External-artifact preparation outcome: \`${PREPARE_OUTCOME}\`"
            echo "- Artifact-inference execution outcome: \`${INFERENCE_OUTCOME}\`"
            echo "- Evidence upload outcome: \`${UPLOAD_OUTCOME}\`"
            echo "- Release evidence status: **${RELEASE_STATUS}**"
            echo "- A PASS means the inference notebook consumed the externally produced E2E artifact with its trusted SHA-256 and the complete evidence bundle was retained by Actions."
            echo "- Static checks are separate and are not treated as execution evidence."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Assert release evidence is complete
        if: always()
        env:
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
          PREPARE_OUTCOME: ${{ steps.prepare-inference.outcome }}
          INFERENCE_OUTCOME: ${{ steps.artifact-inference.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload-evidence.outcome }}
        run: |
          [[ "$E2E_OUTCOME" == "success" ]]
          [[ "$PREPARE_OUTCOME" == "success" ]]
          [[ "$INFERENCE_OUTCOME" == "success" ]]
          [[ "$UPLOAD_OUTCOME" == "success" ]]
