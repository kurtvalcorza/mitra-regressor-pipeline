name: Notebook release execution

on:
  pull_request:
    paths:
      - "tutorials/**"
      - "mitra_pipeline/**"
      - "examples/sample-data/**"
      - "examples/build_sample_datasets.py"
      - "scripts/validate_colab_tutorial.py"
      - "scripts/test_tutorial_api.py"
      - ".github/workflows/notebook-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  execute-notebooks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DIMER_REPO_REF: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"

      - name: Prepare notebook runtime
        run: |
          sudo mkdir -p /content
          sudo chown -R "$USER":"$USER" /content
          python -m pip install --upgrade pip==26.2.1
          python -m pip install psutil==7.1.3 nbconvert==7.17.1 ipykernel==7.3.0

      - name: Execute E2E default path from clean state
        id: e2e
        run: |
          # Execute a copy from /content so the kernel's working directory matches Colab's.
          cp tutorials/mitra_regressor_colab.ipynb /content/mitra_regressor_colab.ipynb
          jupyter nbconvert \
            --to notebook \
            --execute /content/mitra_regressor_colab.ipynb \
            --output executed-mitra-regressor-e2e.ipynb \
            --output-dir /content \
            --ExecutePreprocessor.timeout=2400 \
            --ExecutePreprocessor.kernel_name=python3

      - name: Collect E2E and external-artifact outputs
        id: collect
        run: |
          # The E2E notebook's Section 10 (NOTEBOOK_SPEC 3.0 §19.1) scores the pinned release asset on the default path;
          # the separate ARTIFACT-INFERENCE companion run is gone with the companion notebook.
          mkdir -p /content/mitra-tutorial /content/mitra-inference
          cp /content/outputs/mitra_regressor_predictor.zip /content/mitra-tutorial/mitra-predictor.zip
          cp /content/outputs/external_artifact/mitra_regressor_external_predictions.csv /content/mitra-inference/external-predictions.csv
          cp /content/outputs/external_artifact/mitra_regressor_external_result.json /content/mitra-inference/external-result.json

      - name: Assert external-artifact section outputs
        id: assert-outputs
        run: |
          python -c "import json; r = json.load(open('/content/mitra-inference/external-result.json')); assert r['artifact']['trusted_digest'].startswith('verified (pinned'), r['artifact']; assert r['input']['kind'] == 'sample' and r['input']['rows'] > 0; assert r['evaluation_report']['verdict'] == 'not-measurable'; print('external-artifact section:', r['artifact']['zip_sha256'], r['input']['rows'], 'rows')"

      - name: Upload executed notebooks and predictor artifact
        id: upload-evidence
        if: ${{ always() && steps.e2e.outcome == 'success' && steps.collect.outcome == 'success' && steps.assert-outputs.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mitra-regressor-notebook-release-evidence
          path: |
            /content/executed-mitra-regressor-e2e.ipynb
            /content/mitra-tutorial/mitra-predictor.zip
            /content/mitra-inference/external-predictions.csv
            /content/mitra-inference/external-result.json
          if-no-files-found: error
          retention-days: 30

      - name: Record release evidence
        if: always()
        env:
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
          OUTPUT_OUTCOME: ${{ steps.assert-outputs.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload-evidence.outcome }}
        run: |
          if [[ "$E2E_OUTCOME" == "success" && "$COLLECT_OUTCOME" == "success" && "$OUTPUT_OUTCOME" == "success" && "$UPLOAD_OUTCOME" == "success" ]]; then
            RELEASE_STATUS="PASS"
          else
            RELEASE_STATUS="INCOMPLETE/FAIL"
          fi
          {
            echo "## Mitra Regressor notebook release execution"
            echo
            echo "- Candidate SHA: \`${DIMER_REPO_REF}\`"
            echo "- Runner: \`${RUNNER_OS}\`"
            echo "- Python: \`$(python --version 2>&1)\`"
            echo "- E2E clean execution outcome: \`${E2E_OUTCOME}\`"
            echo "- Output collection (E2E + Section 10 external artifact): \`${COLLECT_OUTCOME}\`"
            echo "- Section 10 output assertions: \`${OUTPUT_OUTCOME}\`"
            echo "- Evidence upload outcome: \`${UPLOAD_OUTCOME}\`"
            echo "- Release evidence status: **${RELEASE_STATUS}**"
            echo "- A PASS means the E2E notebook ran end to end, its Section 10 accepted the pinned release asset only at its pinned SHA-256 and scored the sample rows, and the complete evidence bundle was retained by Actions."
            echo "- Static checks are separate and are not treated as execution evidence."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Assert release evidence is complete
        if: always()
        env:
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
          OUTPUT_OUTCOME: ${{ steps.assert-outputs.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload-evidence.outcome }}
        run: |
          [[ "$E2E_OUTCOME" == "success" ]]
          [[ "$COLLECT_OUTCOME" == "success" ]]
          [[ "$OUTPUT_OUTCOME" == "success" ]]
          [[ "$UPLOAD_OUTCOME" == "success" ]]
