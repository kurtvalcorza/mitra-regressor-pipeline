name: Relay sample provenance pin sync

on:
  push:
    branches:
      - fix/notebook-spec-v1-conformance
    paths:
      - .github/workflows/_relay-sample-pin-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/notebook-spec-v1-conformance
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.14"
      - name: Synchronize immutable sample revision
        run: |
          python - <<'PY'
          from pathlib import Path
          old = "f02e0c38ce835d6b85b5a6f072d232f3cd306f54"
          new = "f11bf59d1bb7e75de42145e311de9773fda1607a"
          paths = [
              Path("tutorials/mitra_regressor_colab.ipynb"),
              Path("scripts/validate_colab_tutorial.py"),
              Path("tutorials/README.md"),
          ]
          for path in paths:
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise RuntimeError(f"old sample revision not found in {path}")
              path.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - name: Validate synchronized provenance
        run: |
          python scripts/validate_colab_tutorial.py
          python scripts/test_colab_csv_headers.py
          git diff --check
      - name: Commit synchronized provenance
        run: |
          git config user.name "Kurt Valcorza"
          git config user.email "102845719+kurtvalcorza@users.noreply.github.com"
          git add tutorials/mitra_regressor_colab.ipynb scripts/validate_colab_tutorial.py tutorials/README.md
          git commit -m "fix(tutorials): synchronize immutable sample provenance [relay-builder]"
          git push origin HEAD:fix/notebook-spec-v1-conformance
