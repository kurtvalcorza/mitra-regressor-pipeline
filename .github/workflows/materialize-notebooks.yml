name: Materialize notebook migration

on:
  push:
    branches:
      - fix/notebook-spec-v1-conformance
    paths:
      - ".github/workflows/materialize-notebooks.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/notebook-spec-v1-conformance
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Materialize notebooks
        run: |
          python scripts/_write_main_notebook.py
          python scripts/_write_inference_notebook.py

      - name: Validate staged migration
        run: |
          python -m pip install -q pandas numpy
          python scripts/validate_colab_tutorial.py
          python scripts/test_tutorial_api.py
          python scripts/test_colab_csv_headers.py

      - name: Remove one-shot staging machinery
        run: |
          rm scripts/_write_main_notebook.py
          rm scripts/_write_inference_notebook.py
          rm .github/workflows/materialize-notebooks.yml

      - name: Commit materialized notebooks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(tutorials): materialize Notebook Spec 1.0 migration"
          git push origin HEAD:fix/notebook-spec-v1-conformance

# retry after both harness import-path fixes
