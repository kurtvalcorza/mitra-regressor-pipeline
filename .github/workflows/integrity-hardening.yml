name: Integrity boundary hardening

on:
  push:
    branches:
      - fix/notebook-spec-v1-conformance
    paths:
      - .github/workflows/integrity-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/notebook-spec-v1-conformance
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
      - name: Apply integrity fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          api = Path("mitra_pipeline/tutorial_api.py")
          text = api.read_text(encoding="utf-8")
          text = text.replace("import stat\nimport urllib.request", "import stat\nimport tempfile\nimport urllib.request", 1)

          old = '''    files: list[zipfile.ZipInfo] = []\n    seen_paths: set[str] = set()\n    for info in zf.infolist():\n'''
          new = '''    files: list[zipfile.ZipInfo] = []\n    seen_paths: set[str] = set()\n    seen_parent_paths: set[str] = set()\n    for info in zf.infolist():\n'''
          if old not in text:
              raise RuntimeError("archive seen-path marker not found")
          text = text.replace(old, new, 1)

          old = '''        if normalized_name in seen_paths:\n            raise RuntimeError(f"Duplicate archive member path is not allowed: {name!r}")\n        seen_paths.add(normalized_name)\n        mode = (info.external_attr >> 16) & 0o170000\n'''
          new = '''        if normalized_name in seen_paths:\n            raise RuntimeError(f"Duplicate archive member path is not allowed: {name!r}")\n        parent_paths = {PurePosixPath(*member.parts[:i]).as_posix() for i in range(1, len(member.parts))}\n        if normalized_name in seen_parent_paths or parent_paths.intersection(seen_paths):\n            raise RuntimeError(f"Archive member path conflicts with a file/directory boundary: {name!r}")\n        seen_paths.add(normalized_name)\n        seen_parent_paths.update(parent_paths)\n        mode = (info.external_attr >> 16) & 0o170000\n'''
          if old not in text:
              raise RuntimeError("archive duplicate marker not found")
          text = text.replace(old, new, 1)

          old = '''def safe_extract_archive(zip_path: str | Path, destination: str | Path) -> Path:\n    destination_path = Path(destination)\n    with zipfile.ZipFile(zip_path) as zf:\n        # Validate the complete archive before making destructive changes to the destination.\n        infos = _validate_zip_members(zf, destination_path)\n        if destination_path.is_symlink():\n            raise RuntimeError("Archive extraction destination must not be a symlink.")\n        if destination_path.exists():\n            shutil.rmtree(destination_path)\n        destination_path.mkdir(parents=True, exist_ok=True)\n        for info in infos:\n            member = PurePosixPath(info.filename)\n            target = destination_path.joinpath(*member.parts)\n            target.parent.mkdir(parents=True, exist_ok=True)\n            with zf.open(info) as source, open(target, "wb") as sink:\n                shutil.copyfileobj(source, sink)\n    return destination_path\n'''
          new = '''def safe_extract_archive(zip_path: str | Path, destination: str | Path) -> Path:\n    destination_path = Path(destination)\n    with zipfile.ZipFile(zip_path) as zf:\n        # Validate the complete archive before touching any prior extraction destination.\n        infos = _validate_zip_members(zf, destination_path)\n        if destination_path.is_symlink():\n            raise RuntimeError("Archive extraction destination must not be a symlink.")\n        destination_path.parent.mkdir(parents=True, exist_ok=True)\n        staging = Path(tempfile.mkdtemp(prefix=f".{destination_path.name}.extract-", dir=destination_path.parent))\n        try:\n            for info in infos:\n                member = PurePosixPath(info.filename)\n                target = staging.joinpath(*member.parts)\n                target.parent.mkdir(parents=True, exist_ok=True)\n                with zf.open(info) as source, open(target, "wb") as sink:\n                    shutil.copyfileobj(source, sink)\n            if destination_path.exists():\n                shutil.rmtree(destination_path)\n            staging.replace(destination_path)\n        except Exception:\n            shutil.rmtree(staging, ignore_errors=True)\n            raise\n    return destination_path\n'''
          if old not in text:
              raise RuntimeError("safe extraction marker not found")
          text = text.replace(old, new, 1)

          text = text.replace(
              'if path.is_file() and path.name != DIMER_MODEL_MANIFEST',
              'if path.is_file() and path != root / DIMER_MODEL_MANIFEST',
              1,
          )
          text = text.replace(
              'for path in sorted(p for p in root.rglob("*") if p.is_file() and p.name != ARTIFACT_MANIFEST):',
              'for path in sorted(p for p in root.rglob("*") if p.is_file() and p != root / ARTIFACT_MANIFEST):',
              1,
          )
          text = text.replace(
              'if path.is_file() and path.name != ARTIFACT_MANIFEST',
              'if path.is_file() and path != root / ARTIFACT_MANIFEST',
              1,
          )

          old = '''    if manifest.get("schema_version") != 1:\n        raise RuntimeError("Unsupported artifact manifest schema_version.")\n'''
          new = '''    if manifest.get("schema_version") != 1:\n        raise RuntimeError("Unsupported artifact manifest schema_version.")\n    if manifest.get("metadata_file") != RUN_METADATA:\n        raise RuntimeError(f"Artifact manifest metadata_file must be {RUN_METADATA!r}.")\n'''
          if old not in text:
              raise RuntimeError("artifact metadata_file marker not found")
          text = text.replace(old, new, 1)
          api.write_text(text, encoding="utf-8")

          tests = Path("scripts/test_tutorial_api.py")
          text = tests.read_text(encoding="utf-8")
          old = '''        write_artifact_manifest(root)\n        manifest, metadata = validate_artifact_directory(root)\n        assert manifest["artifact_format"] == ARTIFACT_FORMAT\n        assert metadata["base_model_revision"] == PINNED_REVISION\n\n        (root / "model.bin").write_bytes(b"tampered")\n'''
          new = '''        write_artifact_manifest(root)\n        manifest, metadata = validate_artifact_directory(root)\n        assert manifest["artifact_format"] == ARTIFACT_FORMAT\n        assert metadata["base_model_revision"] == PINNED_REVISION\n\n        manifest_path = root / "artifact_manifest.json"\n        original_manifest = manifest_path.read_text(encoding="utf-8")\n        tampered_manifest = json.loads(original_manifest)\n        tampered_manifest["metadata_file"] = "elsewhere.json"\n        manifest_path.write_text(json.dumps(tampered_manifest), encoding="utf-8")\n        expect_raises(lambda: validate_artifact_directory(root), "metadata_file")\n        manifest_path.write_text(original_manifest, encoding="utf-8")\n\n        nested_control = root / "nested" / "artifact_manifest.json"\n        nested_control.parent.mkdir()\n        nested_control.write_text("unexpected", encoding="utf-8")\n        expect_raises(lambda: validate_artifact_directory(root), "inventory mismatch")\n        nested_control.unlink()\n        nested_control.parent.rmdir()\n\n        (root / "model.bin").write_bytes(b"tampered")\n'''
          if old not in text:
              raise RuntimeError("artifact regression marker not found")
          text = text.replace(old, new, 1)

          old = '''        expect_raises(lambda: safe_extract_archive(duplicate, td / "out-duplicate"), "duplicate archive member")\n\n        backslash = td / "backslash.zip"\n'''
          new = '''        expect_raises(lambda: safe_extract_archive(duplicate, td / "out-duplicate"), "duplicate archive member")\n\n        conflict = td / "conflict.zip"\n        with zipfile.ZipFile(conflict, "w") as zf:\n            zf.writestr("node", "file")\n            zf.writestr("node/child.txt", "child")\n        expect_raises(lambda: safe_extract_archive(conflict, td / "out-conflict"), "file/directory boundary")\n\n        backslash = td / "backslash.zip"\n'''
          if old not in text:
              raise RuntimeError("archive conflict regression marker not found")
          tests.write_text(text.replace(old, new, 1), encoding="utf-8")

          doc = Path("tutorials/DIMER_MODEL_PACKAGE.md")
          text = doc.read_text(encoding="utf-8")
          text = text.replace(
              "rejects absolute paths, `..` traversal, backslash-based ambiguous paths, symlinks, oversized members, suspicious compression ratios, and excessive total expanded size.",
              "rejects absolute paths, `..` traversal, backslash-based ambiguous paths, duplicate or file/directory-conflicting members, symlinks, oversized members, suspicious compression ratios, and excessive total expanded size. Extraction is staged before replacing any existing destination.",
          )
          doc.write_text(text, encoding="utf-8")
          PY
      - name: Validate integrity boundary
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install pandas==3.0.5 numpy==2.5.3
          python scripts/test_tutorial_api.py
          python scripts/validate_colab_tutorial.py
          python -m py_compile mitra_pipeline/tutorial_api.py scripts/test_tutorial_api.py
          git diff --check
      - name: Commit integrity fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mitra_pipeline/tutorial_api.py scripts/test_tutorial_api.py tutorials/DIMER_MODEL_PACKAGE.md
          git commit -m "fix: close archive and artifact integrity edge cases"
          git push origin HEAD:fix/notebook-spec-v1-conformance
