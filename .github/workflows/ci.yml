name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
      - name: Install static test dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install pandas==3.0.5 numpy==2.5.3
      - name: Shared-block parity
        run: python scripts/check_shared.py
      - name: DIMER contract
        run: python scripts/check_contract.py
      - name: Notebook Specification 1.0 static conformance
        run: python scripts/validate_colab_tutorial.py
      - name: Public tutorial API tests
        run: python scripts/test_tutorial_api.py
      - name: Colab CSV header regressions
        run: python scripts/test_colab_csv_headers.py
      - name: Sample dataset registry regressions
        run: python scripts/test_sample_registry.py
      - name: Compile deployables and tutorial API
        run: |
          python -m py_compile validator/validator.py validator/validate.py validator/contract_hardening.py
          python -m py_compile finetuner/train.py finetuner/contract_entrypoint.py finetuner/contract_hardening.py
          python -m py_compile mitra_pipeline/__init__.py mitra_pipeline/tutorial_api.py
