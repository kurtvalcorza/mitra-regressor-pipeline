name: Apply issue 14 notebook patch

on:
  push:
    branches: [fix/issue-14-tutorial-csv-integrity]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-14-tutorial-csv-integrity
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy
      - name: Apply patch
        run: python scripts/_apply_issue14.py
      - name: Validate tutorial
        run: |
          python scripts/validate_colab_tutorial.py
          python scripts/test_colab_csv_headers.py
      - name: Commit clean result
        run: |
          rm scripts/_apply_issue14.py .github/workflows/_apply-issue14.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: validate CSV headers before parsing ZIP members"
          git push origin HEAD:fix/issue-14-tutorial-csv-integrity
