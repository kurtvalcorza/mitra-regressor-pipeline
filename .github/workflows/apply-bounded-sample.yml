name: Apply bounded default sample

on:
  push:
    branches:
      - fix/notebook-spec-v1-conformance
    paths:
      - ".github/workflows/apply-bounded-sample.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/notebook-spec-v1-conformance
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply bounded sample migration
        run: python scripts/_bound_default_sample.py

      - name: Validate migration
        run: |
          python -m pip install -q pandas numpy
          python scripts/validate_colab_tutorial.py
          python scripts/test_tutorial_api.py
          python scripts/test_colab_csv_headers.py

      - name: Remove one-shot migration files
        run: |
          rm scripts/_bound_default_sample.py
          rm .github/workflows/apply-bounded-sample.yml

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "perf(tutorials): bound default CPU smoke sample"
          git push origin HEAD:fix/notebook-spec-v1-conformance
